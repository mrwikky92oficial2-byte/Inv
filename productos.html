<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Productos | Inventario</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="app-header"></header>
  <main class="container">
    <h1 class="page-title">Productos</h1>
    <div class="page-subtitle">Catálogo con precios y umbrales</div>

    <section class="card">
      <div class="card-body">
        <div class="form-row">
          <div class="field w-2">
            <label class="label" for="sku">SKU</label>
            <input id="sku" class="input" />
          </div>
          <div class="field w-2">
            <label class="label" for="nombre">Nombre</label>
            <input id="nombre" class="input" />
          </div>
          <div class="field w-1">
            <label class="label" for="min">Mínimo</label>
            <input id="min" type="number" min="0" class="input" />
          </div>
          <div class="field w-1">
            <label class="label" for="max">Máximo</label>
            <input id="max" type="number" min="0" class="input" />
          </div>
          <div class="field w-1">
            <label class="label" for="pc">Precio compra</label>
            <input id="pc" type="number" min="0" step="0.01" class="input" />
          </div>
          <div class="field w-1">
            <label class="label" for="pv">Precio venta</label>
            <input id="pv" type="number" min="0" step="0.01" class="input" />
          </div>
        </div>
        <div class="actions" style="margin-top: 12px">
          <button id="btn-add" class="btn btn-primary">Agregar producto</button>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top: 16px">
      <div class="card-header"><div class="card-title">Listado</div></div>
      <div class="card-body" id="list"></div>
    </section>

    <div class="footer small">Hecho con 💜 — Sistema de Inventario</div>
  </main>

  <script type="module">
    import { getProducts, addProduct, deleteProduct } from './js/data.js';
    import './js/common.js';

    const sku = document.getElementById('sku');
    const nombre = document.getElementById('nombre');
    const min = document.getElementById('min');
    const max = document.getElementById('max');
    const pc = document.getElementById('pc');
    const pv = document.getElementById('pv');
    const listEl = document.getElementById('list');

    function render() {
      const prods = getProducts();
      if (!prods.length) return listEl.innerHTML = '<div class="small">No hay productos.</div>';
      listEl.innerHTML = [`<table class="table">`,
        `<thead><tr><th>SKU</th><th>Nombre</th><th>Mín</th><th>Máx</th><th>Compra</th><th>Venta</th><th></th></tr></thead>`,
        `<tbody>`,
        ...prods.map(p => `<tr>
          <td>${p.sku}</td>
          <td>${p.nombre}</td>
          <td>${p.minQty}</td>
          <td>${p.maxQty}</td>
          <td>$${(p.precioCompra ?? 0).toLocaleString('es-CL')}</td>
          <td>$${(p.precioVenta ?? 0).toLocaleString('es-CL')}</td>
          <td><button class="btn btn-danger" data-id="${p.id}">Eliminar</button></td>
        </tr>`),
        `</tbody></table>`
      ].join('');

      for (const b of listEl.querySelectorAll('button[data-id]')) {
        b.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          if (confirm('¿Eliminar producto?')) {
            deleteProduct(id);
            render();
          }
        });
      }
    }

    document.getElementById('btn-add').addEventListener('click', () => {
      if (!sku.value || !nombre.value) return alert('SKU y Nombre requeridos');
      addProduct({ sku: sku.value, nombre: nombre.value, minQty: Number(min.value || 0), maxQty: Number(max.value || 0), precioCompra: Number(pc.value || 0), precioVenta: Number(pv.value || 0) });
      sku.value = nombre.value = min.value = max.value = pc.value = pv.value = '';
      render();
    });

    render();
  </script>
</body>
</html>
