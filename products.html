<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container my-4">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card card-ghost">
            <div class="card-body">
              <h5 class="mb-3">Agregar producto</h5>
              <form id="productForm">
                <div class="mb-2">
                  <label class="form-label">Nombre</label>
                  <input type="text" class="form-control" name="name" required>
                </div>
                <div class="row g-2">
                  <div class="col-6">
                    <label class="form-label">Stock mínimo</label>
                    <input type="number" class="form-control" name="minStock" min="0" value="0">
                  </div>
                  <div class="col-6">
                    <label class="form-label">Stock máximo</label>
                    <input type="number" class="form-control" name="maxStock" min="0" value="0">
                  </div>
                </div>
                <div class="row g-2 mt-1">
                  <div class="col-6">
                    <label class="form-label">Precio compra</label>
                    <input type="number" class="form-control" name="purchasePrice" min="0" step="0.01" value="0">
                  </div>
                  <div class="col-6">
                    <label class="form-label">Precio venta</label>
                    <input type="number" class="form-control" name="salePrice" min="0" step="0.01" value="0">
                  </div>
                </div>
                <div class="mt-3 d-grid">
                  <button class="btn btn-primary" type="submit">Agregar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card card-ghost">
            <div class="card-body">
              <div class="d-flex align-items-center justify-content-between">
                <h5 class="mb-0">Productos</h5>
              </div>
              <div class="table-responsive mt-3">
                <table class="table align-middle" id="productsTable">
                  <thead>
                    <tr>
                      <th>Producto</th>
                      <th class="text-end">Mín</th>
                      <th class="text-end">Máx</th>
                      <th class="text-end">Compra</th>
                      <th class="text-end">Venta</th>
                    </tr>
                  </thead>
                  <tbody><tr><td colspan="5" class="text-center text-muted">Cargando...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>window.ACTIVE_PAGE = 'products';</script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/pages/products.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
