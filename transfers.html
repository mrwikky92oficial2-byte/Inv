<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario - Traslados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container my-4">
      <div class="card card-ghost">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Desde</label>
              <select class="form-select" id="trFrom"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Hacia</label>
              <select class="form-select" id="trTo"></select>
            </div>
          </div>
          <div class="row g-3 mt-1">
            <div class="col-12">
              <label class="form-label">Producto</label>
              <div class="input-group">
                <select class="form-select" id="trProduct"></select>
                <input type="number" class="form-control" id="trQty" placeholder="Cantidad" min="1" value="1">
                <button class="btn btn-primary" id="trAddBtn">Agregar</button>
              </div>
            </div>
          </div>
          <div class="table-responsive mt-3">
            <table class="table align-middle" id="trTable">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th class="text-end">Cantidad</th>
                  <th></th>
                </tr>
              </thead>
              <tbody><tr><td colspan="3" class="text-center text-muted">Agregue productos para trasladar</td></tr></tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <div class="small-muted" id="trSummary">0 ítems</div>
            <button class="btn btn-primary" id="trPostBtn">Registrar traslado</button>
          </div>
        </div>
      </div>

      <div class="card card-ghost mt-4">
        <div class="card-body">
          <h6 class="mb-3">Historial de traslados</h6>
          <div class="table-responsive">
            <table class="table align-middle" id="trHistory">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Desde</th>
                  <th>Hacia</th>
                  <th>Detalle</th>
                </tr>
              </thead>
              <tbody><tr><td colspan="4" class="text-center text-muted">Sin movimientos</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script>window.ACTIVE_PAGE = 'transfers';</script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/pages/transfers.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
