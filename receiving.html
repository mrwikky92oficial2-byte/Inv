<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario - Recepción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container my-4">
      <div class="card card-ghost">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Ubicación</label>
              <select class="form-select" id="rcvLocation"></select>
            </div>
            <div class="col-md-8">
              <label class="form-label">Producto</label>
              <div class="input-group">
                <select class="form-select" id="rcvProduct"></select>
                <input type="number" class="form-control" id="rcvQty" placeholder="Cantidad" min="1" value="1">
                <input type="number" class="form-control" id="rcvCost" placeholder="Costo unit." min="0" step="0.01" value="0">
                <button class="btn btn-primary" id="addItemBtn">Agregar</button>
              </div>
            </div>
          </div>
          <div class="table-responsive mt-3">
            <table class="table align-middle" id="rcvTable">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th class="text-end">Cantidad</th>
                  <th class="text-end">Costo unit.</th>
                  <th class="text-end">Subtotal</th>
                  <th></th>
                </tr>
              </thead>
              <tbody><tr><td colspan="5" class="text-center text-muted">Agregue productos para recibir</td></tr></tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <div class="small-muted" id="rcvSummary">0 ítems</div>
            <button class="btn btn-primary" id="postReceiptBtn">Registrar recepción</button>
          </div>
        </div>
      </div>
    </main>

    <script>window.ACTIVE_PAGE = 'receiving';</script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/pages/receiving.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
