<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario - Ubicaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container my-4">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card card-ghost">
            <div class="card-body">
              <h5 class="mb-3">Agregar ubicación</h5>
              <form id="locationForm">
                <div class="mb-2">
                  <label class="form-label">Nombre</label>
                  <input type="text" class="form-control" name="name" required>
                </div>
                <div class="mb-2">
                  <label class="form-label">Tipo</label>
                  <select class="form-select" name="type">
                    <option value="store">Tienda</option>
                    <option value="warehouse">Bodega Central</option>
                  </select>
                </div>
                <div class="mt-3 d-grid">
                  <button class="btn btn-primary" type="submit">Agregar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card card-ghost">
            <div class="card-body">
              <div class="d-flex align-items-center justify-content-between">
                <h5 class="mb-0">Ubicaciones</h5>
              </div>
              <div class="table-responsive mt-3">
                <table class="table align-middle" id="locationsTable">
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Tipo</th>
                    </tr>
                  </thead>
                  <tbody><tr><td colspan="2" class="text-center text-muted">Cargando...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>window.ACTIVE_PAGE = 'locations';</script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/pages/locations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
