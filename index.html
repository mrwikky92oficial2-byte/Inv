<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container my-4">
      <div class="row g-4">
        <div class="col-12">
          <div class="card card-ghost">
            <div class="card-body">
              <div class="d-flex align-items-center justify-content-between">
                <div>
                  <h4 class="mb-1">Productos próximos a acabarse</h4>
                  <div class="small-muted">Basado en stock total vs mínimo</div>
                </div>
                <a href="purchases.html" class="btn btn-primary">Crear orden de compra</a>
              </div>
              <div class="table-responsive mt-3">
                <table class="table align-middle" id="lowStockTable">
                  <thead>
                    <tr>
                      <th>Producto</th>
                      <th class="text-center">Stock total</th>
                      <th class="text-center">Mínimo</th>
                      <th class="text-center">Máximo</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr><td colspan="4" class="text-center text-muted">Cargando...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>window.ACTIVE_PAGE = 'dashboard';</script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/pages/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
