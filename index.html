<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
</head>
<body class="bg-light">
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h3 m-0">Dashboard</h1>
      <div>
        <button class="btn btn-outline-primary btn-sm" id="refreshDashboard">
          <i class="bi bi-arrow-clockwise"></i> Refrescar
        </button>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white border-0 d-flex align-items-center justify-content-between">
            <h2 class="h5 m-0 text-primary">Productos próximos a acabarse</h2>
            <span class="badge bg-primary-subtle text-primary" id="lowStockCount">0</span>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table align-middle" id="lowStockTable">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>SKU</th>
                    <th>Stock</th>
                    <th>Umbral</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="4" class="text-center text-muted">Cargando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
            <img src="/assets/img/empty-illustration.svg" alt="Inventario" style="max-width: 200px;" class="mb-3 opacity-75"/>
            <p class="text-muted m-0">Bienvenido al sistema de inventario. Usa la barra de navegación para acceder a los módulos.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="/assets/config/api.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
