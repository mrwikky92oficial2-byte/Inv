<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario - Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container my-4">
      <div class="card card-ghost">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-6">
              <label class="form-label">Ubicación</label>
              <select class="form-select" id="locationSelect"></select>
            </div>
            <div class="col-md-6 text-md-end">
              <span class="badge bg-secondary" id="totalSkus">0 SKUs</span>
              <span class="badge badge-purple" id="totalUnits">0 unidades</span>
            </div>
          </div>

          <div class="table-responsive mt-3">
            <table class="table align-middle" id="inventoryTable">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th class="text-end">Cantidad</th>
                  <th class="text-end">Mín</th>
                  <th class="text-end">Máx</th>
                </tr>
              </thead>
              <tbody><tr><td colspan="4" class="text-center text-muted">Seleccione una ubicación</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script>window.ACTIVE_PAGE = 'inventory';</script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/pages/inventory.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
