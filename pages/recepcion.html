<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recepción de Mercadería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h4 m-0">Recepción de Mercadería</h1>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" id="createBtn">Nuevo</button>
        <button class="btn btn-outline-secondary" id="reloadBtn">Refrescar</button>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead id="dataHead"></thead>
            <tbody id="dataBody">
              <tr><td colspan="99" class="text-center text-muted">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="crudModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="crudForm">
        <div class="modal-header">
          <h5 class="modal-title">Recepción</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3" id="formFields"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="/assets/config/api.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/assets/js/crud.js"></script>
  <script>
    const page = new CrudPage({
      entity: 'recepcion',
      columns: [
        { key: 'codigo', label: 'Código' },
        { key: 'proveedor', label: 'Proveedor' },
        { key: 'fecha', label: 'Fecha' },
        { key: 'estado', label: 'Estado' }
      ],
      formFields: [
        { name: 'codigo', label: 'Código', type: 'text' },
        { name: 'proveedor', label: 'Proveedor', type: 'text' },
        { name: 'fecha', label: 'Fecha', type: 'date' },
        { name: 'estado', label: 'Estado', type: 'text' }
      ],
      endpoints: Endpoints.recepcion
    });

    function mount(){
      page.init();
      document.getElementById('reloadBtn').addEventListener('click', ()=> page.load());
    }

    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', mount);
    }else{ mount(); }
  </script>
</body>
</html>
